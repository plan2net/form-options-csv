name: CI

on:
  push:
  pull_request:

jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --no-progress
      - run: composer run qa

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test

  end-to-end:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3: ['12', '13', '14']
    name: end-to-end / TYPO3 ${{ matrix.typo3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ddev/github-action-setup-ddev@v1
      - run: ddev e2e-setup ${{ matrix.typo3 }}
      - run: ddev e2e ${{ matrix.typo3 }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-typo3-${{ matrix.typo3 }}
          path: test-results/
