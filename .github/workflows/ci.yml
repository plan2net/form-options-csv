name: CI

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        typo3: ['12.4', '13.4', '14.3']
        exclude:
          - php: '8.5'
            typo3: '12.4'
    name: TYPO3 ${{ matrix.typo3 }} / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      # Public 12.4 releases carry advisories fixed only in paid ELTS releases.
      - if: matrix.typo3 == '12.4'
        run: composer config policy.advisories.block false
      - run: composer require --no-update "typo3/cms-core:^${{ matrix.typo3 }}" "typo3/cms-form:^${{ matrix.typo3 }}"
      - run: composer update --no-progress
      - run: composer run qa
