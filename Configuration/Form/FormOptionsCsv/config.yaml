name: plan2net/form-options-csv
label: 'Form options CSV import'
priority: 200

prototypes:
  standard:
    formEditor:
      # Every editor text is looked up as a key in these files, so our keys have their own prefix.
      translationFiles:
        1604589938: 'EXT:form_options_csv/Resources/Private/Language/locallang_form_editor.xlf'
      dynamicJavaScriptModules:
        additionalViewModelModules:
          1604589938: '@plan2net/form-options-csv/options-import.js'
      formEditorFluidConfiguration:
        partialRootPaths:
          1604589938: 'EXT:form_options_csv/Resources/Private/Backend/Partials/FormEditor/'
      formEditorPartials:
        Inspector-OptionsImportEditor: Inspector/OptionsImportEditor
    formElementsDefinition:
      SingleSelect: &optionsImport
        formEditor:
          predefinedDefaults:
            properties:
              options: []
          editors:
            300:
              propertyValidators:
                10: null
            310:
              identifier: optionsImport
              templateName: Inspector-OptionsImportEditor
              label: 'formOptionsCsv.button'
              labels:
                dropArea: 'formOptionsCsv.dropArea'
                columnLabel: 'formOptionsCsv.columnLabel'
                columnValue: 'formOptionsCsv.columnValue'
                columnDefault: 'formOptionsCsv.columnDefault'
                columnNote: 'formOptionsCsv.columnNote'
                cancel: 'formOptionsCsv.cancel'
                addOne: 'formOptionsCsv.addOne'
                addMany: 'formOptionsCsv.addMany'
                replaceOne: 'formOptionsCsv.replaceOne'
                replaceMany: 'formOptionsCsv.replaceMany'
                hasHeader: 'formOptionsCsv.hasHeader'
                replace: 'formOptionsCsv.replace'
                header: 'formOptionsCsv.header'
                noLabel: 'formOptionsCsv.noLabel'
                valueExists: 'formOptionsCsv.valueExists'
                valueRepeated: 'formOptionsCsv.valueRepeated'
                onlyOneDefault: 'formOptionsCsv.onlyOneDefault'
                unclosedQuote: 'formOptionsCsv.unclosedQuote'
                spreadsheetFile: 'formOptionsCsv.spreadsheetFile'
                unsupportedFile: 'formOptionsCsv.unsupportedFile'
      MultiSelect: *optionsImport
      MultiCheckbox: *optionsImport
      RadioButton: *optionsImport
